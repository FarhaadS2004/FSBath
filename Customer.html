<body bgcolor="#f5f5f5">


    <center align="center">


        <header>

                Welcome to FS Luxury Bathroom Installations, where we bring your dream bathroom to life.

            <br>

            <nav>

                <a href="Packages.html">Packages</a>

            </nav>

        </header>

        <main>

            <style>
                form {
                    background-color: white;
                    max-width: 600px;
                    margin: 25px auto;
                    padding: 25px;
                    border-radius: 10px;
                    box-shadow: 0 2px 6px rgba(145, 60, 60, 0.1);
                }

                input {
                    width: 100%;
                    padding: 10px;
                    border: 1px solid #bbb;
                    border-radius: 5px;
                    box-sizing: border-box;
                    font-size: 16px;
                }

                input:focus {
                    outline: none;
                    border-color: #8b5e3c;
                    box-shadow: 0 0 5px rgba(139, 94, 60, 0.4);
                }

                /* DataList fields */
                input[list] {
                    background-color: #fff;
                }
            </style>
            <h2>Create Customer Account</h2>

            <form>
                <label for="fname">First Name </label>
                <input type="text" placeholder="First Name" name="fname>

<label for=" lname">Last Name </label>
                <input type="text" placeholder="Last Name" name="lname>

<label for=" email"> Email Address</label>
                <input type="email" id="" email>

                <label for="" password"> Password</label>
                <input type="Password" id="password" </form>

                <form>

                    <h2>Location & Preferences</h2>

                    <label for="State">State</label>

                    <input list="States" id="state">

                    <datalist id="States">
                        <option value="Pennsylvania">
                        <option value="New Jersey">
                        <option value="Maryland">
                        <option value="New York">
                    </datalist>

                    <label for="country">Country</label>

                    <input list="Countries" id="Country">

                    <datalist id="Countries">
                        <option value="United States">
                        <option value="Canada">
                        <option value="Mexico">
                        <option value="United Kingdom">
                    </datalist>
                </form>

            </form>


        </main>
